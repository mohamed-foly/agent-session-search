# Host paths to your agents' session directories are kept out of the image
# and out of the app's own .env — set them here (or override via a
# docker-compose .env in this same directory) so the repo stays generic.
# Mounted read-only: this tool only ever reads session files, never writes them.

services:
  agent-session-search:
    build:
      context: .
      args:
        # Match your host user so bind-mounted writes (the SQLite index)
        # come out owned by you, not root. Defaults already match a typical
        # single-user Linux desktop's first account.
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: agent-session-search
    restart: unless-stopped
    ports:
      - "${PORT:-4173}:4173"
    environment:
      PORT: 4173
      INDEX_DB_PATH: /data/index.sqlite3
      REINDEX_INTERVAL_SECONDS: ${REINDEX_INTERVAL_SECONDS:-120}
      ENABLED_AGENTS: ${ENABLED_AGENTS:-claude-code,codex}
      CLAUDE_CODE_SESSIONS_DIR: /sessions/claude-code
      CODEX_SESSIONS_DIR: /sessions/codex
      # The real host paths behind the mounts below, so search results show
      # paths you can actually open on the host instead of container-internal ones.
      CLAUDE_CODE_HOST_SESSIONS_DIR: ${CLAUDE_CODE_HOST_DIR:-${HOME}/.claude/projects}
      CODEX_HOST_SESSIONS_DIR: ${CODEX_HOST_DIR:-${HOME}/.codex/sessions}
      CLAUDE_CODE_RESUME_COMMAND: ${CLAUDE_CODE_RESUME_COMMAND:-cd {cwd} && claude --resume {sessionId}}
      CODEX_RESUME_COMMAND: ${CODEX_RESUME_COMMAND:-cd {cwd} && codex resume {sessionId}}
    volumes:
      - ./data:/data
      # NOTE: "~" does not expand inside Docker bind-mount paths — use ${HOME}
      # (passed through from the host shell) or set an absolute path in a
      # compose-level .env file in this directory.
      - ${CLAUDE_CODE_HOST_DIR:-${HOME}/.claude/projects}:/sessions/claude-code:ro
      - ${CODEX_HOST_DIR:-${HOME}/.codex/sessions}:/sessions/codex:ro
